    <circle cx="176" cy="198" r="2.5" fill="#fff"/>
    <path d="M153 180 Q166 160 188 172" fill="none" stroke="#2b2446" stroke-width="5" stroke-linecap="round" transform=""/>
<ellipse cx="230" cy="186" rx="16" ry="21" fill="#fff"/>
