    <g fill="#6c63a8"><rect x="-22" y="-4" width="12" height="10" rx="3"/><rect x="-6" y="-4" width="12" height="10" rx="3"/><rect x="10" y="-4" width="12" height="10" rx="3"/>
    <rect x="-22" y="10" width="12" height="10" rx="3"/><rect x="-6" y="10" width="12" height="10" rx="3"/><rect x="10" y="10" width="12" height="24" rx="3" fill="#da291c"/>
    <rect x="-22" y="24" width="12" height="10" rx="3"/><rect x="-6" y="24" width="12" height="10" rx="3"/></g>
  </g>
  <circle cx="112" cy="300" r="12" fill="#ffe3d3"/>
  <!-- голова -->
