  <path d="M234 262 Q276 262 300 234" fill="none" stroke="url(#tee)" stroke-width="22" stroke-linecap="round"/>
  <path d="M160 246 Q200 234 240 246 Q256 252 258 272 L262 336 Q262 346 250 346 H150 Q138 346 138 336 L142 272 Q144 252 160 246 Z" fill="url(#tee)"/>
  <path d="M184 248 Q200 262 216 248" fill="none" stroke="#17967a" stroke-width="5" stroke-linecap="round"/>
