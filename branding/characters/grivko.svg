<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Гривко рахує на калькуляторі 50/50">
  <defs>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f4f"/>
      <stop offset="1" stop-color="#7b5cd6"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ffb938"/>
    </linearGradient>
    <g id="wing">
      <rect x="-128" y="-15" width="140" height="30" rx="15" fill="#ffffff" transform="rotate(38)"/>
      <rect x="-108" y="-15" width="120" height="30" rx="15" fill="#ffe1dc" transform="rotate(16)"/>
      <rect x="-86" y="-15" width="98" height="30" rx="15" fill="#ffc2b8" transform="rotate(-6)"/>
    </g>
    <!-- Купюра (як у логотипі), центр у 0,0: 224×132 -->
    <g id="note">
      <rect x="-112" y="-66" width="224" height="132" rx="18" fill="#ffffff" stroke="#b81d12" stroke-width="8"/>
      <rect x="-94" y="-48" width="188" height="96" rx="8" fill="none" stroke="#da291c" stroke-width="6" stroke-dasharray="2 11" stroke-linecap="round" opacity=".5"/>
      <circle r="40" fill="#da291c"/>
      <path d="M-15 -17 C-8 -30 20 -28 18 -11 C16 2 -18 2 -19 17 C-20 32 8 33 19 21" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
      <path d="M-26 -3 H26 M-26 10 H26" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g id="flying">
      <use href="#wing" transform="translate(-100 -20)"/>
      <use href="#wing" transform="translate(100 -20) scale(-1 1)"/>
      <use href="#note"/>
    </g>
  
    <linearGradient id="tee" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ed3b0"/><stop offset="1" stop-color="#1fae8e"/></linearGradient>
    <linearGradient id="iris2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2410"/><stop offset="1" stop-color="#c4812f"/></linearGradient></defs>

  <use href="#flying" transform="translate(64 96) rotate(-14) scale(.18)"/>
  <use href="#flying" transform="translate(344 170) rotate(12) scale(.14)"/>
  <use href="#flying" transform="translate(48 310) rotate(8) scale(.12)"/>
  <g transform="translate(306 58)">
    <path transform="" d="M-50 -24 H50 A16 16 0 0 1 66 -8 V10 A16 16 0 0 1 50 26 H-18 L-34 42 L-32 26 H-50 A16 16 0 0 1 -66 10 V-8 A16 16 0 0 1 -50 -24 Z" fill="#fff"/>
    <text x="0" y="9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="800" fill="#da291c">50 / 50</text></g>
  <ellipse cx="200" cy="378" rx="92" ry="12" fill="#000" opacity=".16"/>
  <rect x="174" y="334" width="20" height="36" rx="9" fill="#2d3a5c"/>
