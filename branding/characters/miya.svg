  <path d="M350 222 L353 230 L361 232 L353 234 L350 242 L347 234 L339 232 L347 230 Z M40 190 L42 196 L48 198 L42 200 L40 206 L38 200 L32 198 L38 196 Z" fill="#fff" opacity=".9"/>
