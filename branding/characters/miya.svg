    <ellipse cx="229" cy="192" rx="6" ry="9" fill="#1b1433"/>
    <circle cx="223" cy="181" r="5.5" fill="#fff"/>
    <circle cx="234" cy="198" r="2.5" fill="#fff"/>
    <path d="M213 180 Q226 160 248 172" fill="none" stroke="#2b2446" stroke-width="5" stroke-linecap="round" transform="translate(460 0) scale(-1 1)"/>

  <ellipse cx="148" cy="212" rx="12" ry="6.5" fill="#ff8a95" opacity=".6"/><ellipse cx="252" cy="212" rx="12" ry="6.5" fill="#ff8a95" opacity=".6"/>
  <path d="M190 212 Q200 226 210 212 Z" fill="#c2334a" stroke="#c2334a" stroke-width="3" stroke-linejoin="round"/>
