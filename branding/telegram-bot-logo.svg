<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef3a2b"/>
      <stop offset="1" stop-color="#b81d12"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3ece8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5a0a04" flood-opacity=".35"/>
    </filter>
    <g id="wing">
      <rect x="-128" y="-15" width="140" height="30" rx="15" fill="#ffffff" transform="rotate(38)"/>
      <rect x="-108" y="-15" width="120" height="30" rx="15" fill="#fbeeea" transform="rotate(16)"/>
      <rect x="-86" y="-15" width="98" height="30" rx="15" fill="#f4dcd6" transform="rotate(-6)"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 272) rotate(-10) scale(1.08)" filter="url(#sh)">
    <use href="#wing" transform="translate(-100 -20)"/>
    <use href="#wing" transform="translate(100 -20) scale(-1 1)"/>
    <rect x="-112" y="-66" width="224" height="132" rx="18" fill="url(#note)"/>
    <rect x="-98" y="-52" width="196" height="104" rx="10" fill="none" stroke="#da291c" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round" opacity=".55"/>
    <circle cx="0" cy="0" r="42" fill="#da291c"/>
    <text x="0" y="20" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="60" font-weight="700" fill="#fff">₴</text>
    <circle cx="-74" cy="-34" r="7" fill="#da291c" opacity=".7"/>
    <circle cx="74" cy="34" r="7" fill="#da291c" opacity=".7"/>
  </g>
</svg>
