<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- seo:start -->
  <title>Спільні витрати — рахуйте витрати з друзями без сварок</title>
  <meta name="description" content="Додавайте спільні витрати в поїздках, квартирі чи на вечірках — застосунок сам порахує, хто кому скільки винен. Фото чеків, різні валюти, запрошення за посиланням.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Спільні витрати — рахуйте витрати з друзями без сварок">
  <meta property="og:description" content="Додавайте спільні витрати в поїздках, квартирі чи на вечірках — застосунок сам порахує, хто кому скільки винен.">
  <meta property="og:image" content="/og.png?v=2">
  <meta name="twitter:card" content="summary_large_image">
  <!-- seo:end -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/nova.css">
  <script>
    // Версія дизайну з минулого візиту — одразу, щоб сторінка не «блимала» іншим оформленням.
    try { var d = localStorage.getItem('design'); if (d === 'dark' || d === 'nova') document.documentElement.dataset.design = d; } catch (e) {}
    if (!document.documentElement.dataset.design) document.documentElement.dataset.design = 'nova';
  </script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="На головну"><img class="brand-logo" alt="Спільні витрати" height="40"></a>
    <script>
      // Логотип одразу, без проміжного тексту: вбудований під поточний дизайн (свій логотип адміна підставить app.js).
      document.querySelector('.brand-logo').src = '/logos/' + (document.documentElement.dataset.design === 'dark' ? 'dark' : 'nova') + '.png';
    </script>
    <div id="userbox"></div>
  </header>
  <main id="app" aria-live="polite"></main>
  <nav id="tabbar" class="tabbar" aria-label="Розділи" hidden></nav>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
