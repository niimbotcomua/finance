<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Спільні витрати</title>
  <meta name="theme-color" content="#0d0d0f">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/mono.css">
  <script>
    // Версія дизайну з минулого візиту — одразу, щоб сторінка не «блимала» іншим оформленням.
    try { document.documentElement.dataset.design = localStorage.getItem('design') || 'dark'; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">💸 Спільні витрати</a>
    <div id="userbox"></div>
  </header>
  <main id="app" aria-live="polite"></main>
  <nav id="tabbar" class="tabbar" aria-label="Розділи" hidden></nav>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
